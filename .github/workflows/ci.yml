name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
      - run: mix local.rebar --force
      - run: ./scripts/build.sh
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: elixir scripts/check-ci-policy.exs
      - run: elixir scripts/check-docs.exs
      - run: mix test
        env:
          IPSE_TEST_STDIO_PROBE: '1'
      - name: macOS native enforcement
        if: runner.os == 'macOS'
        run: |
          rustc --edition=2021 --test native/ipse-macos-sandbox.rs -o "$RUNNER_TEMP/ipse-macos-policy-test"
          "$RUNNER_TEMP/ipse-macos-policy-test"
          mix test test/macos_sandbox_test.exs test/stdio_runner_test.exs test/macos_filesystem_test.exs --include macos_sandbox --include macos_filesystem
      - run: ./bin/ipse demo
      - run: ./scripts/package.sh
      - run: elixir scripts/verify-package.exs dist/ipse-*.tar.gz
      - name: Independent installed extension proof
        run: |
          elixir examples/extension-lab/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-extension-lab"
          elixir examples/extension-lab/verify-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-extension-lab"
      - name: Independent installed model-call proof
        run: |
          elixir examples/model-calls/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-model-calls"
          elixir examples/model-calls/verify-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-model-calls"
          elixir examples/model-calls/verify-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-model-calls" none
      - name: Independent source and installed MCP-call proof
        run: |
          elixir examples/mcp-actions/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-mcp-actions"
          mix run examples/mcp-actions/verify.exs "$RUNNER_TEMP/ipse-mcp-actions"
          elixir examples/mcp-actions/verify-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-mcp-actions"
      - name: Independent source and installed embedding proof
        run: |
          elixir examples/embedding-actions/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-embedding-actions"
          mix run examples/embedding-actions/verify.exs "$RUNNER_TEMP/ipse-embedding-actions"
          elixir examples/embedding-actions/verify-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-embedding-actions"
      - name: Independent knowledge preset admission
        run: |
          mix run examples/knowledge/verify-builds.exs _build/dev/lib/ipse/ebin "$RUNNER_TEMP/ipse-knowledge-presets"
      - name: Independent source and installed saved-result proof
        run: |
          elixir examples/saved-results/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-saved-results"
          mix run examples/saved-results/verify.exs "$RUNNER_TEMP/ipse-saved-results"
          elixir examples/saved-results/verify-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-saved-results"
      - name: Independent source and installed knowledge proof
        run: |
          elixir extensions/knowledge/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-knowledge/corpus" --package corpus --preset state-lexical
          elixir extensions/knowledge/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-knowledge/graph" --package graph --preset state-explicit
          elixir extensions/knowledge/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-knowledge/research" --package research --preset offline
          elixir extensions/knowledge/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-knowledge/corpus-mcp" --package corpus --preset mcp-lexical
          elixir extensions/knowledge/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-knowledge/research-mcp" --package research --preset mcp
          mix run examples/knowledge/verify.exs "$RUNNER_TEMP/ipse-knowledge"
          mix run examples/knowledge/verify-complete-results.exs "$RUNNER_TEMP/ipse-knowledge"
          mix run examples/knowledge/verify-independence.exs "$RUNNER_TEMP/ipse-knowledge"
          mix run examples/knowledge/verify-evaluation.exs "$RUNNER_TEMP/ipse-knowledge/corpus"
          mix run examples/knowledge/verify-mcp.exs "$RUNNER_TEMP/ipse-knowledge/corpus-mcp"
          mix run examples/knowledge/verify-research.exs "$RUNNER_TEMP/ipse-knowledge/research-mcp"
          mix run examples/knowledge/verify-recovery.exs "$RUNNER_TEMP/ipse-knowledge-presets/graph-state-model"
          mix run examples/knowledge/verify-lifecycle.exs "$RUNNER_TEMP/ipse-knowledge-presets/graph-state-model" graph
          mix run examples/knowledge/verify-lifecycle.exs "$RUNNER_TEMP/ipse-knowledge-presets/corpus-state-dense" corpus
          elixir examples/knowledge/verify-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-knowledge"
          elixir examples/knowledge/verify-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-knowledge" complete
          elixir examples/knowledge/verify-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-knowledge" independence
          elixir examples/knowledge/verify-mcp-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-knowledge/corpus-mcp"
          elixir examples/knowledge/verify-mcp-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-knowledge/research-mcp" research
          elixir examples/knowledge/verify-recovery-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-knowledge-presets/graph-state-model"
          elixir examples/knowledge/verify-recovery-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-knowledge-presets/graph-state-model" graph
          elixir examples/knowledge/verify-recovery-package.exs dist/ipse-*.tar.gz "$RUNNER_TEMP/ipse-knowledge-presets/corpus-state-dense" corpus
      - name: Experimental macOS App Sandbox enforcement
        if: runner.os == 'macOS'
        run: |
          IPSE_MACOS_WORKSPACE=$(mktemp -d)
          trap 'rm -rf "$IPSE_MACOS_WORKSPACE"' EXIT
          elixir scripts/verify-macos-sandbox.exs priv/ipse-runner "$IPSE_MACOS_WORKSPACE"
