name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - uses: dtolnay/rust-toolchain@stable
      - run: mix local.rebar --force
      - run: ./scripts/build.sh
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - name: macOS native enforcement
        if: runner.os == 'macOS'
        run: |
          rustc --edition=2021 --test native/ipse-macos-sandbox.rs -o "$RUNNER_TEMP/ipse-macos-policy-test"
          "$RUNNER_TEMP/ipse-macos-policy-test"
          mix test test/macos_sandbox_test.exs test/stdio_runner_test.exs --include macos_sandbox
      - run: ./bin/ipse demo
      - run: ./scripts/package.sh
      - run: elixir scripts/verify-package.exs dist/ipse-*.tar.gz
      - name: Experimental macOS App Sandbox enforcement
        if: runner.os == 'macOS'
        run: |
          IPSE_MACOS_WORKSPACE=$(mktemp -d)
          trap 'rm -rf "$IPSE_MACOS_WORKSPACE"' EXIT
          elixir scripts/verify-macos-sandbox.exs priv/ipse-runner "$IPSE_MACOS_WORKSPACE"
