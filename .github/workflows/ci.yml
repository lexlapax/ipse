name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/build.sh
      - run: mix format --check-formatted
      - run: mix test
      - run: ./bin/runespell demo
