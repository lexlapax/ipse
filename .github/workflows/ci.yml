name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
      - run: mix local.rebar --force
      - run: ./scripts/build.sh
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - name: Native optional protocols
        if: runner.os == 'Linux'
        run: |
          rustc --edition=2021 --test -D warnings native/ipse-sequence.rs -o "$RUNNER_TEMP/ipse-sequence-tests"
          "$RUNNER_TEMP/ipse-sequence-tests"
          rustc --edition=2021 --test -D warnings native/ipse-listener.rs -o "$RUNNER_TEMP/ipse-listener-tests"
          "$RUNNER_TEMP/ipse-listener-tests"
          rustc --edition=2021 --test -D warnings native/ipse-runner.rs -o "$RUNNER_TEMP/ipse-runner-tests"
          "$RUNNER_TEMP/ipse-runner-tests" bound_environment_excludes_manager_state_and_keeps_only_selected_values
      - name: Native bound authority controls
        run: |
          rustc --edition=2021 --test -D warnings native/ipse-bound.rs -o "$RUNNER_TEMP/ipse-bound-tests"
          "$RUNNER_TEMP/ipse-bound-tests"
      - name: Native regular-file copy controls
        run: |
          rustc --edition=2021 --test -D warnings native/ipse-file-copy.rs -o "$RUNNER_TEMP/ipse-file-copy-tests"
          "$RUNNER_TEMP/ipse-file-copy-tests"
      - run: elixir scripts/check-ci-policy.exs
      - run: elixir scripts/check-docs.exs
      - run: mix test
        env:
          IPSE_TEST_STDIO_PROBE: '1'
      - name: macOS native enforcement
        if: runner.os == 'macOS'
        run: |
          rustc --edition=2021 --test native/ipse-macos-sandbox.rs -o "$RUNNER_TEMP/ipse-macos-policy-test"
          "$RUNNER_TEMP/ipse-macos-policy-test"
          mix test test/macos_sandbox_test.exs test/stdio_runner_test.exs test/macos_filesystem_test.exs --include macos_sandbox --include macos_filesystem
      - run: ./bin/ipse demo
      - run: ./scripts/package.sh
      - run: elixir scripts/verify.exs installed package --archive dist/ipse-*.tar.gz --input examples/memory/corpus.json
      - name: Independent installed model-service ownership proof
        run: |
          rustc --edition=2021 -D warnings test/support/model_service_probe.rs -o "$RUNNER_TEMP/ipse-model-service-probe"
          elixir scripts/verify.exs installed model-service --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-model-service-probe" --output "$RUNNER_TEMP/ipse-model-service-installed"
      - name: Independent installed extension proof
        run: |
          elixir scripts/build-artifact.exs extension-lab --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-extension-lab"
          elixir scripts/verify.exs installed lab --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-extension-lab"
      - name: Independent installed model-call proof
        run: |
          elixir scripts/build-artifact.exs model-calls --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-model-calls"
          elixir scripts/verify.exs installed model --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-model-calls" --selection default
          elixir scripts/verify.exs installed model --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-model-calls" --selection none
          elixir scripts/verify.exs installed model --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-model-calls" --selection json
          elixir scripts/verify.exs installed model --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-model-calls" --selection json-none
      - name: Independent source and installed MCP-call proof
        run: |
          elixir scripts/build-artifact.exs mcp-actions --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-mcp-actions"
          elixir scripts/verify.exs source mcp --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-mcp-actions"
          elixir scripts/verify.exs installed mcp --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-mcp-actions"
      - name: Independent source and installed embedding proof
        run: |
          elixir scripts/build-artifact.exs embedding-actions --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-embedding-actions"
          elixir scripts/verify.exs source embedding --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-embedding-actions"
          elixir scripts/verify.exs installed embedding --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-embedding-actions"
      - name: Independent knowledge preset admission
        run: |
          mix run examples/knowledge/verify-builds.exs _build/dev/lib/ipse/ebin "$RUNNER_TEMP/ipse-knowledge-presets"
      - name: Independent source and installed saved-result proof
        run: |
          elixir scripts/build-artifact.exs saved-results --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-saved-results"
          elixir scripts/verify.exs source saved-results --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-saved-results"
          elixir scripts/verify.exs installed saved-results --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-saved-results"
      - name: Independent source and installed knowledge proof
        run: |
          elixir extensions/knowledge/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-knowledge/corpus" --package corpus --preset state-lexical
          elixir extensions/knowledge/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-knowledge/graph" --package graph --preset state-explicit
          elixir extensions/knowledge/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-knowledge/research" --package research --preset offline
          elixir extensions/knowledge/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-knowledge/corpus-mcp" --package corpus --preset mcp-lexical
          elixir extensions/knowledge/build.exs --sdk _build/dev/lib/ipse/ebin --output "$RUNNER_TEMP/ipse-knowledge/research-mcp" --package research --preset mcp
          elixir scripts/verify.exs source knowledge --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-knowledge"
          elixir scripts/verify.exs source knowledge-complete --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-knowledge"
          elixir scripts/verify.exs source knowledge-independence --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-knowledge"
          elixir scripts/verify.exs source knowledge-evaluation --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-knowledge/corpus"
          elixir scripts/verify.exs source knowledge-mcp --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-knowledge/corpus-mcp"
          elixir scripts/verify.exs source knowledge-research --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-knowledge/research-mcp"
          elixir scripts/verify.exs source knowledge-recovery --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-knowledge-presets/graph-state-model"
          elixir scripts/verify.exs source knowledge-graph-lifecycle --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-knowledge-presets/graph-state-model"
          elixir scripts/verify.exs source knowledge-corpus-lifecycle --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-knowledge-presets/corpus-state-dense"
          elixir scripts/verify.exs source knowledge-selection --sdk _build/dev/lib/ipse/ebin --input "$RUNNER_TEMP/ipse-knowledge-presets/corpus-state-dense"
          elixir scripts/verify.exs installed knowledge --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-knowledge"
          elixir scripts/verify.exs installed knowledge-complete --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-knowledge"
          elixir scripts/verify.exs installed knowledge-independence --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-knowledge"
          elixir scripts/verify.exs installed knowledge-evaluation --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-knowledge/corpus"
          elixir scripts/verify.exs installed knowledge-mcp --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-knowledge/corpus-mcp"
          elixir scripts/verify.exs installed knowledge-research --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-knowledge/research-mcp"
          elixir scripts/verify.exs installed knowledge-recovery --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-knowledge-presets/graph-state-model"
          elixir scripts/verify.exs installed knowledge-graph-lifecycle --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-knowledge-presets/graph-state-model"
          elixir scripts/verify.exs installed knowledge-corpus-lifecycle --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-knowledge-presets/corpus-state-dense"
          elixir scripts/verify.exs installed knowledge-selection --archive dist/ipse-*.tar.gz --input "$RUNNER_TEMP/ipse-knowledge-presets/corpus-state-dense"
      - name: Experimental macOS App Sandbox enforcement
        if: runner.os == 'macOS'
        run: |
          IPSE_MACOS_WORKSPACE=$(mktemp -d)
          trap 'rm -rf "$IPSE_MACOS_WORKSPACE"' EXIT
          elixir scripts/verify-macos-sandbox.exs priv/ipse-runner "$IPSE_MACOS_WORKSPACE"
